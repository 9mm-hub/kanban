<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Kanban</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
:root{
  --bg:#0f0f11;--surface:#1a1a1f;--surface2:#212127;--surface3:#26262d;
  --border:#2e2e38;--border2:#38383f;
  --text:#e4e4ea;--text-dim:#9494a2;--text-muted:#5c5c6b;
  --accent:#6c5fd5;
  --pauta-dot:#0085ff;--pauta-text:#3d9bff;--pauta-bg:rgba(0,133,255,.1);--pauta-border:rgba(0,133,255,.3);
  --and-dot:#ffb900;--and-text:#ffb900;--and-bg:rgba(255,185,0,.1);--and-border:rgba(255,185,0,.3);
  --pau-dot:#5c5c6b;--pau-text:#9494a2;--pau-bg:rgba(92,92,107,.1);--pau-border:rgba(92,92,107,.3);
  --conc-dot:#00ca72;--conc-text:#00ca72;--conc-bg:rgba(0,202,114,.1);--conc-border:rgba(0,202,114,.3);
  --r:9px;--rsm:5px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',-apple-system,sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden;font-size:13px}

/* HDR */
#hdr{display:flex;align-items:center;gap:10px;padding:0 16px;height:48px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0}
#hdr-title{font-size:13px;font-weight:600}
#hdr-sep{width:1px;height:16px;background:var(--border2)}
#hdr-board{font-size:11px;color:var(--text-muted);max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#hdr-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.hbtn{background:var(--surface2);border:1px solid var(--border);color:var(--text-dim);padding:4px 10px;border-radius:var(--rsm);font-size:11px;cursor:pointer;font-family:inherit;white-space:nowrap}
.hbtn:hover{border-color:var(--accent);color:var(--accent)}

/* FILTRO PESSOA */
#fp-wrap{position:relative;display:none}
#fp-dd{display:none;position:absolute;top:calc(100% + 4px);right:0;background:#1e1e1e;border:1px solid #444;border-radius:8px;z-index:500;min-width:180px;max-height:240px;overflow-y:auto;box-shadow:0 6px 16px rgba(0,0,0,.6)}
#fp-dd.open{display:block}
#fp-dd label{display:flex;align-items:center;gap:8px;padding:6px 12px;font-size:11px;color:#ddd;cursor:pointer;user-select:none}
#fp-dd label:hover{background:#2e2e2e}
#fp-dd input[type=checkbox]{accent-color:var(--accent)}
#fp-dd .fp-sep{border-bottom:1px solid #333;margin-bottom:2px}

/* SORT */
#sort-sel{background:var(--surface2);border:1px solid var(--border);color:var(--text-dim);padding:4px 8px;border-radius:var(--rsm);font-size:11px;font-family:inherit;cursor:pointer;outline:none}

/* BOARD */
#board{flex:1;overflow:auto;padding:12px 16px;display:flex;flex-direction:column;gap:0;cursor:grab;user-select:none;min-width:0}
#board::-webkit-scrollbar{width:4px}
#board::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}

/* PERSON KANBAN */
.pkanban{display:flex;flex-direction:column;border-bottom:1px solid var(--border);padding-bottom:12px;margin-bottom:12px}
.pkanban-hdr{display:flex;align-items:center;gap:8px;padding:8px 0 10px;flex-shrink:0}
.pav{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;flex-shrink:0;overflow:hidden}
.pav img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.pname{font-size:12px;font-weight:600;color:var(--text)}
.pcount{font-size:11px;color:var(--text-muted)}
.pkanban-cols{display:flex;gap:12px;min-width:max-content}

/* COLUNA */
.col{width:460px;flex-shrink:0;display:flex;flex-direction:column;gap:8px}
.col-hdr{display:flex;align-items:center;gap:7px;padding:0 2px 4px;flex-shrink:0}
.col-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.col-title{font-size:10px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;flex:1}
.col-count{font-size:10px;color:var(--text-muted);background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:1px 6px;font-weight:600}
.col[data-s="Em Pauta"] .col-dot{background:var(--pauta-dot)}
.col[data-s="Em Pauta"] .col-title{color:var(--pauta-text)}
.col[data-s="Em Andamento"] .col-dot{background:var(--and-dot)}
.col[data-s="Em Andamento"] .col-title{color:var(--and-text)}
.col[data-s="Concluído"] .col-dot{background:var(--conc-dot)}
.col[data-s="Concluído"] .col-title{color:var(--conc-text)}
.col[data-s="Concluídos Hoje"] .col-dot{background:#00ca72}
.col[data-s="Concluídos Hoje"] .col-title{color:#00ca72}
.col[data-s="Concluídos Ontem"] .col-dot{background:#00a85a}
.col[data-s="Concluídos Ontem"] .col-title{color:#00a85a}
.col[data-s="Pausado"] .col-dot{background:var(--pau-dot)}
.col[data-s="Pausado"] .col-title{color:var(--pau-text)}
.col-body{display:flex;flex-direction:column;gap:7px;min-height:80px;border-radius:var(--r);padding:2px;overflow:visible;flex:1}.col-scroll{max-height:calc(4 * 132px + 3 * 7px);min-height:80px;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;gap:7px;flex:1}.col-scroll::-webkit-scrollbar{width:4px}.col-scroll::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
.col.drag-over .col-body{background:rgba(108,95,213,.06);outline:1px dashed rgba(108,95,213,.35)}

/* GRID 2 colunas dentro da col */
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:7px}

/* CARD */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:10px 11px;display:flex;flex-direction:column;gap:8px;cursor:default;transition:border-color .15s,box-shadow .15s,opacity .15s;min-width:0}
.drag-handle{color:var(--text-muted);cursor:grab;font-size:14px;line-height:1;padding:0 4px 0 0;flex-shrink:0;user-select:none;opacity:.5}
.drag-handle:hover{opacity:1;color:var(--text-dim)}
.card.dragging{opacity:.35}
.card:hover{border-color:var(--border2);box-shadow:0 3px 12px rgba(0,0,0,.3)}
.card.dragging{opacity:.35;cursor:grabbing}
.card-top{display:flex;align-items:flex-start;gap:5px;min-width:0}
.card-title{font-size:11px;font-weight:600;color:var(--text);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;line-height:1.4}
.card-actions{display:flex;gap:3px;flex-shrink:0}
.cbtn{width:20px;height:20px;background:none;border:1px solid var(--border);border-radius:4px;color:var(--text-muted);cursor:pointer;font-size:10px;display:flex;align-items:center;justify-content:center;transition:all .15s;flex-shrink:0}
.cbtn:hover{border-color:var(--accent);color:var(--accent)}
.card-brief{font-size:10px;color:var(--text-dim);padding:5px 8px;background:var(--surface2);border-radius:var(--rsm);border-left:2px solid var(--border2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;text-decoration:none}
.card-brief.empty{color:var(--text-muted);font-style:italic;border-left-color:var(--border)}
a.card-brief:hover{color:var(--accent);border-left-color:var(--accent)}

/* SUB ROW */
.srow{display:flex;align-items:center;gap:4px;padding:4px 6px;background:var(--surface2);border-radius:var(--rsm);border:1px solid var(--border);min-width:0}
.sname{font-size:10px;color:var(--text-dim);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}

/* PRAZO */
.sprazo{position:relative;display:flex;align-items:center;gap:2px;background:var(--surface3);border:1px solid var(--border2);border-radius:4px;padding:2px 5px;font-size:10px;font-weight:500;color:var(--text-dim);cursor:pointer;white-space:nowrap;transition:all .15s;flex-shrink:0;user-select:none;box-sizing:border-box}
/* Wrapper do prazo — tamanho fixo, posição relativa para o ::before */
.prazo-wrap{position:relative;display:inline-flex;align-items:center;flex-shrink:0;background:var(--surface3);border:1px solid var(--border2);border-radius:4px;height:22px;padding:0 7px;min-width:0;transition:border-color .15s,background .15s;cursor:pointer;}
.prazo-wrap::before{content:attr(data-label);color:var(--text-dim);font-size:10px;font-weight:500;white-space:nowrap;pointer-events:none;line-height:1;}
.prazo-wrap.od{border-color:rgba(239,83,80,.5);background:rgba(239,83,80,.08)}.prazo-wrap.od::before{color:#ef5350;}
.prazo-wrap.td{border-color:rgba(255,185,0,.5);background:rgba(255,185,0,.08)}.prazo-wrap.td::before{color:#ffb900;}
.prazo-wrap.sn{border-color:rgba(0,133,255,.5);background:rgba(0,133,255,.08)}.prazo-wrap.sn::before{color:#3d9bff;}
.prazo-wrap:hover{border-color:var(--accent);}
/* Input sobre o wrapper — opacity minima para o picker nativo funcionar */
.sprazo-input{position:absolute;inset:0;width:100%;height:100%;opacity:0.004;cursor:pointer;border:none;background:none;font-size:1px;font-family:inherit;color-scheme:dark;color:transparent;}
.sprazo:hover{border-color:var(--accent);color:var(--accent)}
.sprazo.od{border-color:rgba(239,83,80,.5);color:#ef5350;background:rgba(239,83,80,.08)}
.sprazo.td{border-color:rgba(255,185,0,.5);color:#ffb900;background:rgba(255,185,0,.08)}
.sprazo.sn{border-color:rgba(0,133,255,.5);color:#3d9bff;background:rgba(0,133,255,.08)}


/* STATUS */
.sst{position:relative;flex-shrink:0}
.stbadge{display:flex;align-items:center;gap:3px;padding:2px 6px;border-radius:4px;font-size:10px;font-weight:600;cursor:pointer;white-space:nowrap;border:1px solid transparent;transition:filter .15s}
.stbadge:hover{filter:brightness(1.15)}
.stbadge.ep{background:var(--pauta-bg);border-color:var(--pauta-border);color:var(--pauta-text)}
.stbadge.ea{background:var(--and-bg);border-color:var(--and-border);color:var(--and-text)}
.stbadge.pa{background:var(--pau-bg);border-color:var(--pau-border);color:var(--pau-text)}
.stbadge.co{background:var(--conc-bg);border-color:var(--conc-border);color:var(--conc-text)}
.stdd{position:fixed;top:0;left:0;background:var(--surface2);border:1px solid var(--border2);border-radius:var(--rsm);z-index:9999;box-shadow:0 8px 24px rgba(0,0,0,.55);display:none;min-width:140px;overflow:hidden}
.stdd.open{display:block}
.stdd-item{padding:7px 11px;font-size:11px;color:var(--text-dim);cursor:pointer;display:flex;align-items:center;gap:7px;transition:background .1s}
.stdd-item:hover{background:var(--border);color:var(--text)}
.stdd-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}

/* DRAG GHOST */
#ghost{position:fixed;pointer-events:none;z-index:9999;background:var(--surface2);border:1px solid var(--accent);border-radius:var(--r);padding:7px 11px;font-size:11px;font-weight:600;color:var(--text);box-shadow:0 8px 24px rgba(0,0,0,.6);display:none;max-width:200px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* LOADING */
#loading{flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;color:var(--text-muted)}
.spin{width:22px;height:22px;border:2px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* TOAST */
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--surface2);border:1px solid var(--border2);color:var(--text);padding:7px 14px;border-radius:8px;font-size:11px;z-index:999;display:none;box-shadow:0 4px 16px rgba(0,0,0,.4);white-space:nowrap}
#toast.show{display:block}
#toast.err{border-color:#ef5350;color:#ef5350}

/* ACESSO PANEL */
#access-panel{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;align-items:center;justify-content:center}
#access-panel.open{display:flex}
#access-box{background:#000;border:1px solid var(--border);border-radius:12px;padding:20px;min-width:300px;max-width:400px}
#access-box h3{font-size:14px;font-weight:500;margin-bottom:14px}
#access-list{display:flex;flex-direction:column;gap:4px;max-height:260px;overflow-y:auto;margin-bottom:12px}
.access-item{display:flex;align-items:center;gap:10px;padding:6px 10px;border-radius:6px;background:#111;font-size:12px;color:#ddd}
.access-item input[type=checkbox]{accent-color:var(--accent);cursor:pointer;width:15px;height:15px}
.abtn{width:100%;padding:8px;border:none;border-radius:6px;cursor:pointer;font-size:13px;font-weight:600;margin-top:6px}
.abtn.primary{background:var(--accent);color:#fff}
.abtn.secondary{background:var(--surface2);border:1px solid var(--border);color:var(--text-dim)}
</style>
</head>
<body>
<div id="hdr">
  <div id="hdr-title">Kanban</div>
  <div id="hdr-sep"></div>
  <div id="hdr-board">—</div>
  <div id="hdr-left" style="display:flex;align-items:center;gap:6px;margin-left:12px">
    <select id="sort-sel"><option value="asc">Prazo ↑</option><option value="desc">Prazo ↓</option></select>
    <button class="hbtn" id="btn-refresh">↻</button>
  </div>
  <div id="hdr-right">
    <div id="fp-wrap">
      <button class="hbtn" id="fp-btn">Todas as pessoas</button>
      <div id="fp-dd"></div>
    </div>
    <button class="hbtn" id="btn-access" style="display:none">🔒 Acesso</button>
  </div>
</div>
<div id="loading"><div class="spin"></div><span>Carregando...</span></div>
<div id="board" style="display:none"></div>
<div id="toast"></div>
<div id="ghost"></div>
<div id="access-panel">
  <div id="access-box">
    <h3>🔒 Controle de acesso</h3>
    <p style="font-size:11px;color:#666;margin-bottom:10px">Admins veem todos e têm filtro de pessoas.</p>
    <div id="access-list"></div>
    <button class="abtn primary" id="btn-save-access">Guardar</button>
    <button class="abtn secondary" id="btn-close-access">Cancelar</button>
  </div>
</div>

(function(){
  if(typeof mondaySdk==='function') initKanban(mondaySdk());
  else document.getElementById('loading').innerHTML='<span style="color:#ef5350">Erro: SDK não encontrado.</span>';
})();

function initKanban(monday){

// ─── CONSTANTES ───────────────────────────────────────────────────────
const STATUS_COLS=['Em Pauta','Em Andamento','Pausado','Concluídos Hoje','Concluídos Ontem','Concluído'];
const READONLY_COLS=new Set(['Concluídos Ontem','Concluído']);
const COL_TO_STATUS={'Em Pauta':'Em pauta','Em Andamento':'Em andamento','Pausado':'Pausado','Concluídos Hoje':'Concluído'};
const STATUS_META={'Em pauta':{cls:'ep',dot:'#0085ff'},'Em andamento':{cls:'ea',dot:'#ffb900'},'Pausado':{cls:'pa',dot:'#5c5c6b'},'Concluído':{cls:'co',dot:'#00ca72'}};
const MON=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];

// ─── ESTADO ───────────────────────────────────────────────────────────
let allItems=[],allPeople=[],userNameById={},userPhotoById={};
let selPersons=[],sortOrder='asc',dragItem=null,autoSaveEnabled=false;
let boardId=null,isAdmin=false,isMainAdmin=false,currentUserName='',subAdmins=[];

// ─── UTILS ────────────────────────────────────────────────────────────
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

async function api(q){
  const r=await monday.api(q);
  if(r?.errors){
    const ce=r.errors.find(e=>e.extensions?.code==='COMPLEXITY_BUDGET_EXHAUSTED');
    if(ce){await sleep((ce.extensions?.retry_in_seconds||30)*1000);return api(q);}
    throw new Error(r.errors[0]?.message||'API error');
  }
  return r;
}

// subitem status → coluna kanban
function subColuna(subStatus,itemKs){
  const s=(subStatus||'').toLowerCase().trim();
  if(s==='em pauta')return 'Em Pauta';
  if(s==='em andamento')return 'Em Andamento';
  if(s==='pausado')return 'Pausado';
  if(s.includes('conclu')){
    if(itemKs==='Concluídos Hoje')return 'Concluídos Hoje';
    if(itemKs==='Concluídos Ontem')return 'Concluídos Ontem';
    return 'Concluído';
  }
  return itemKs||'Em Pauta';
}

function stCls(s){
  const n=(s||'').toLowerCase().trim();
  if(n.includes('andamento'))return 'ea';
  if(n.includes('pausado'))return 'pa';
  if(n.includes('conclu'))return 'co';
  return 'ep';
}

function parseRange(str){if(!str)return null;const m=str.match(/(\d{4}-\d{2}-\d{2})/);return m?new Date(m[1]+'T12:00:00'):null;}
function fmtDate(d){return d?d.toISOString().split('T')[0]:'';}
function prazoLabel(ds){if(!ds)return'—';const d=new Date(ds+'T12:00:00'),today=new Date();today.setHours(12,0,0,0);const diff=Math.round((d-today)/86400000);const day=d.getDate().toString().padStart(2,'0'),mon=MON[d.getMonth()];if(diff<0)return`${day} ${mon} ⚠`;if(diff===0)return'Hoje';if(diff===1)return'Amanhã';return`${day} ${mon}`;}
function prazoClass(ds){if(!ds)return'';const d=new Date(ds+'T12:00:00'),today=new Date();today.setHours(12,0,0,0);const diff=Math.round((d-today)/86400000);return diff<0?'od':diff===0?'td':diff<=2?'sn':'';}

const avColors=['#5c7cfa','#f06595','#ffa94d','#51cf66','#cc5de8','#22b8cf','#ff6b6b','#74c0fc'];
const avMap={};let avI=0;
function avColor(n){if(!avMap[n])avMap[n]=avColors[avI++%avColors.length];return avMap[n];}
function initials(n){return(n||'?').split(' ').map(p=>p[0]).join('').slice(0,2).toUpperCase();}
function makeAv(name,size){
  const av=document.createElement('div');av.className='pav';
  av.style.cssText=`width:${size}px;height:${size}px;font-size:${size<20?7:size<28?9:11}px;`;
  const ph=userPhotoById[name];
  if(ph){av.innerHTML=`<img src="${ph}" alt="${initials(name)}"/>`;}
  else{av.style.background=avColor(name);av.textContent=initials(name);}
  return av;
}

function toast(msg,err){
  const t=document.getElementById('toast');
  t.textContent=msg;t.className=err?'show err':'show';
  clearTimeout(toast._tt);toast._tt=setTimeout(()=>t.className='',2500);
}

// ─── API ──────────────────────────────────────────────────────────────
async function fetchSchema(bId){
  let schema=[];
  let cursor=null;
  do{
    const cp=cursor?`,cursor:"${cursor}"` :'';
    const r=await api(`query{boards(ids:[${bId}]){items_page(limit:20${cp}){cursor items{subitems{board{id columns{id title type}}}}}}}`);
    const page=r.data.boards[0].items_page;
    for(const it of page.items){
      if(it.subitems?.length&&it.subitems[0].board?.columns?.length){
        schema=it.subitems[0].board.columns;break;
      }
    }
    if(schema.length)break;
    cursor=page.cursor||null;
    if(cursor)await sleep(300);
  }while(cursor);
  return schema;
}

async function fetchUsers(){
  const r=await api('query{users{id name photo_thumb}}');
  (r.data.users||[]).forEach(u=>{if(u.name){userNameById[String(u.id)]=u.name;if(u.photo_thumb)userPhotoById[u.name]=u.photo_thumb;}});
}

async function fetchItems(bId){
  const gRes=await api(`query{boards(ids:[${bId}]){groups{id title}}}`);
  const tgt=gRes.data.boards[0].groups.filter(g=>{
    const t=g.title.trim();
    return t==='Em Pauta'||t==='Em Andamento'||t==='Pausado'
      ||t.includes('HOJE')||t.includes('Hoje')
      ||t.includes('ONTEM')||t.includes('Ontem')
      ||t==='Concluído'||t==='Concluido';
  });
  if(!tgt.length)return[];
  const tgtIds=new Set(tgt.map(g=>g.id));
  let fetched=[],cursor=null;
  do{
    const cp=cursor?`,cursor:"${cursor}"` :'';
    const q=`query{boards(ids:[${bId}]){items_page(limit:100${cp}){cursor items{id name group{id title} column_values{id text} subitems{id name board{id} column_values{id text}}}}}}`;
    let res;try{res=await api(q);}catch(e){break;}
    const page=res.data.boards[0].items_page;
    fetched=fetched.concat(page.items.filter(it=>tgtIds.has(it.group.id)).map(it=>({...it,_gt:it.group.title.trim()})));
    cursor=page.cursor||null;
    if(cursor)await sleep(200);
  }while(cursor);
  return fetched;
}

function processItems(raw,schema){
  const ctm={};schema.forEach(c=>ctm[c.id]=c.title);
  const pset=new Set();
  const result=raw.map(item=>{
    const gt=item._gt;
    let ks='Em Pauta';
    if(gt==='Em Andamento')ks='Em Andamento';
    else if(gt==='Pausado')ks='Pausado';
    else if(gt.includes('HOJE')||gt.includes('Hoje'))ks='Concluídos Hoje';
    else if(gt.includes('ONTEM')||gt.includes('Ontem'))ks='Concluídos Ontem';
    else if(gt==='Concluído'||gt==='Concluido')ks='Concluído';

    const subs=(item.subitems||[]).map(sub=>{
      const cols={},cids={};
      sub.column_values.forEach(c=>{const t=ctm[c.id]||c.id;cols[t]=c.text;cids[t]=c.id;});
      const resp=(cols['Resp.']||cols['Responsavel']||cols['Resp']||'').trim();
      const cron=cols['Cronograma']||'';
      const status=cols['Status']||'';
      const briefing=cols['Briefing']||cols['briefing']||'';
      const tipoJob=cols['Tipo de Job']||cols['Tipo']||'';
      return{subId:sub.id,boardId:sub.board?.id,name:sub.name,resp,cron,status,briefing,tipoJob,
        cronColId:cids['Cronograma']||null,statusColId:cids['Status']||null,_range:parseRange(cron)};
    }).filter(s=>s.resp);
    subs.forEach(s=>pset.add(s.resp));
    if(!subs.length)return null;
    const briefing=subs.find(s=>s.briefing)?.briefing||'';
    return{id:item.id,name:item.name,ks,briefing,subs};
  }).filter(Boolean);
  allPeople=[...pset].sort((a,b)=>a.localeCompare(b));
  return result;
}

// ─── MUTATIONS ────────────────────────────────────────────────────────
async function mutPrazo(sub,newDate){
  if(!sub.boardId||!sub.cronColId){
    toast('cronColId null — veja console',true);
    console.error('mutPrazo: cronColId null',sub);return;
  }
  try{
    // Timeline column: value must be a JSON string with from/to
    const val=JSON.stringify({from:newDate,to:newDate});
    const q=`mutation{change_column_value(board_id:${sub.boardId},item_id:${sub.subId},column_id:"${sub.cronColId}",value:${JSON.stringify(val)}){id}}`;
    console.log('mutPrazo query:',q);
    const r=await monday.api(q);
    console.log('mutPrazo result:',r);
    if(r?.errors){throw new Error(r.errors[0]?.message||'GraphQL error');}
    sub.cron=newDate;sub._range=parseRange(newDate);
    toast('Prazo atualizado!');render();
  }catch(e){
    toast('Erro prazo: '+e.message,true);
    console.error('mutPrazo error:',e,'sub:',sub);
  }
}

async function mutSubStatus(sub,newLabel){
  if(!sub.boardId||!sub.statusColId){
    toast('statusColId null — veja console',true);
    console.error('mutSubStatus: null',sub);return;
  }
  try{
    const val=JSON.stringify({label:newLabel});
    await monday.api(`mutation{change_column_value(board_id:${sub.boardId},item_id:${sub.subId},column_id:"${sub.statusColId}",value:${JSON.stringify(val)}){id}}`);
    sub.status=newLabel;
    if(newLabel==='Concluído'){
      // move o item pai para Concluídos Hoje visualmente
      const parent=allItems.find(it=>it.subs.includes(sub));
      if(parent&&!parent.ks.includes('Conclu'))parent.ks='Concluídos Hoje';
    }
    toast('Status atualizado!');render();
  }catch(e){toast('Erro ao atualizar status: '+e.message,true);console.error(e);}
}

// ─── DRAG (mousedown/mousemove/mouseup — igual ao pauta-timeline) ─────
function setupDrag(cardEl,item,person){
  const handle=cardEl.querySelector('.drag-handle');
  if(!handle)return;

  let dragging=false,startX=0,startY=0,ghost=null;

  handle.addEventListener('mousedown',e=>{
    if(e.button!==0)return;
    e.stopPropagation();
    startX=e.clientX;startY=e.clientY;dragging=false;

    ghost=document.createElement('div');
    ghost.style.cssText='position:fixed;pointer-events:none;z-index:9999;background:#23233a;color:#e4e4ea;border:1px solid #6c5fd5;border-radius:6px;padding:5px 12px;font-size:11px;font-weight:600;white-space:nowrap;display:none;max-width:220px;overflow:hidden;text-overflow:ellipsis;';
    ghost.textContent=item.name||'';
    document.body.appendChild(ghost);

    window.addEventListener('mousemove',onMove);
    window.addEventListener('mouseup',onUp);
  });

  handle.addEventListener('click',e=>e.stopPropagation());

  function onMove(ev){
    const dx=ev.clientX-startX,dy=ev.clientY-startY;
    if(!dragging&&(Math.abs(dx)>5||Math.abs(dy)>5)){
      dragging=true;
      cardEl.classList.add('dragging');
      handle.style.cursor='grabbing';
    }
    if(!dragging)return;
    ghost.style.display='block';
    ghost.style.left=(ev.clientX+14)+'px';
    ghost.style.top=(ev.clientY+14)+'px';

    // detectar drop zone escondendo card e ghost momentaneamente
    cardEl.style.visibility='hidden';
    ghost.style.display='none';
    const el=document.elementFromPoint(ev.clientX,ev.clientY);
    cardEl.style.visibility='';
    ghost.style.display='block';

    document.querySelectorAll('.col.drag-over').forEach(z=>z.classList.remove('drag-over'));
    const targetCol=el?.closest('.col');
    const colSt=targetCol?.dataset?.s;
    if(targetCol&&colSt&&!READONLY_COLS.has(colSt)){
      targetCol.classList.add('drag-over');
      ghost.textContent='→ '+(COL_TO_STATUS[colSt]||colSt);
    } else {
      ghost.textContent=item.name||'';
    }
  }

  async function onUp(ev){
    window.removeEventListener('mousemove',onMove);
    window.removeEventListener('mouseup',onUp);
    if(ghost){ghost.remove();ghost=null;}
    cardEl.classList.remove('dragging');
    cardEl.style.visibility='';
    handle.style.cursor='grab';

    document.querySelectorAll('.col.drag-over').forEach(z=>z.classList.remove('drag-over'));
    if(!dragging){dragging=false;return;}
    // sinaliza que houve drag — bloqueia o click do card que vem depois do mouseup
    cardEl.dataset.wasDragged='1';
    setTimeout(()=>delete cardEl.dataset.wasDragged,100);
    dragging=false;

    // detectar drop zone no mouseup
    cardEl.style.visibility='hidden';
    const el=document.elementFromPoint(ev.clientX,ev.clientY);
    cardEl.style.visibility='';

    // busca a coluna pelo elemento sob o cursor — pode ser col, col-scroll, col-body ou col-hdr
    const targetCol=el?.closest('.col');
    const targetSt=targetCol?.dataset?.s;
    console.log('drop targetSt:',targetSt,'el:',el?.className);
    if(!targetSt||READONLY_COLS.has(targetSt))return;
    const newLabel=COL_TO_STATUS[targetSt];
    if(!newLabel)return;
    const mySub=item.subs.find(s=>s.resp===person);
    if(!mySub){toast('Subitem não encontrado',true);return;}
    if(mySub.status===newLabel)return;
    await mutSubStatus(mySub,newLabel);
  }
}

function setupDrop(){} // não precisa — tudo no mouseup do drag

// ─── RENDER ───────────────────────────────────────────────────────────
function sortItems(items,person){
  return[...items].sort((a,b)=>{
    const sa=a.subs.find(s=>s.resp===person);
    const sb=b.subs.find(s=>s.resp===person);
    const da=sa?._range?.getTime()??(sortOrder==='asc'?Infinity:-Infinity);
    const db=sb?._range?.getTime()??(sortOrder==='asc'?Infinity:-Infinity);
    return sortOrder==='asc'?da-db:db-da;
  });
}

function render(){
  const board=document.getElementById('board');board.innerHTML='';
  const showPeople=isAdmin?(selPersons.length?selPersons:allPeople):[currentUserName];

  showPeople.forEach(person=>{
    const pk=document.createElement('div');pk.className='pkanban';
    const phdr=document.createElement('div');phdr.className='pkanban-hdr';
    phdr.appendChild(makeAv(person,28));
    const pnm=document.createElement('span');pnm.className='pname';pnm.textContent=person;
    const total=allItems.filter(it=>it.subs.some(s=>s.resp===person)).length;
    const pct=document.createElement('span');pct.className='pcount';pct.textContent=` · ${total} job${total!==1?'s':''}`;
    phdr.appendChild(pnm);phdr.appendChild(pct);pk.appendChild(phdr);

    const colsWrap=document.createElement('div');colsWrap.className='pkanban-cols';

    STATUS_COLS.forEach(st=>{
      const pItems=sortItems(allItems.filter(it=>{
        const mySub=it.subs.find(s=>s.resp===person);
        return mySub&&subColuna(mySub.status,it.ks)===st;
      }),person);

      const col=document.createElement('div');col.className='col';col.dataset.s=st;
      col.innerHTML=`<div class="col-hdr"><div class="col-dot"></div><div class="col-title">${st}</div><div class="col-count">${pItems.length}</div></div>`;

      const body=document.createElement('div');body.className='col-body';
      const scroll=document.createElement('div');scroll.className='col-scroll';
      setupDrop(scroll,st); // drop no scroll wrapper
      const grid=document.createElement('div');grid.className='cgrid';
      pItems.forEach(it=>grid.appendChild(buildCard(it,person)));
      scroll.appendChild(grid);body.appendChild(scroll);
      col.appendChild(body);colsWrap.appendChild(col);
    });

    pk.appendChild(colsWrap);board.appendChild(pk);
  });
}

function buildCard(item,person){
  const subs=item.subs.filter(s=>s.resp===person);
  const sub=subs[0];

  const card=document.createElement('div');card.className='card';

  // ── clique no card abre o subitem (com guarda contra drag e elementos interativos) ──
  let _cardClickOk=false;
  card.addEventListener('mousedown',e=>{
    // só arma o clique se não for em elemento interativo
    const skip=e.target.closest('.drag-handle,.cbtn,.stbadge,.stdd,.prazo-wrap,.sprazo-input,.card-brief');
    _cardClickOk=!skip;
  });
  card.addEventListener('click',e=>{
    if(!_cardClickOk)return;
    if(card.dataset.wasDragged)return;
    const skip=e.target.closest('.drag-handle,.cbtn,.stbadge,.stdd,.prazo-wrap,.sprazo-input,.card-brief');
    if(skip)return;
    if(sub){monday.execute('openItemCard',{itemId:parseInt(sub.subId)});}
    else{monday.execute('openItemCard',{itemId:parseInt(item.id)});}
  });

  // ── título + drag handle ──
  const top=document.createElement('div');top.className='card-top';
  const title=document.createElement('div');title.className='card-title';
  title.textContent=item.name;title.title=item.name;
  // cursor pointer no título indica clicabilidade
  title.style.cursor='pointer';
  const dh=document.createElement('div');dh.className='drag-handle';dh.textContent='⠿';dh.title='Arrastar';
  top.appendChild(title);top.appendChild(dh);card.appendChild(top);

  // setupDrag DEPOIS do handle estar no DOM
  setupDrag(card,item,person);

  // ── briefing ──
  const hasBrief=!!(sub?.briefing||item.briefing);
  const briefUrl=sub?.briefing||item.briefing||'';
  const brief=document.createElement(hasBrief?'a':'div');
  brief.className='card-brief'+(hasBrief?'':' empty');
  if(hasBrief){brief.href=briefUrl;brief.target='_blank';brief.rel='noopener noreferrer';}
  brief.textContent=hasBrief?briefUrl:'Sem briefing';brief.title=briefUrl;
  card.appendChild(brief);

  if(sub){
    // ── tipo de job + 💬 ──
    const tjrow=document.createElement('div');
    tjrow.style.cssText='display:flex;align-items:center;gap:4px;min-width:0;';
    const tj=document.createElement('div');tj.className='sname';tj.style.flex='1';
    tj.textContent=sub.tipoJob||sub.name||'—';tj.title=tj.textContent;
    const btnU=document.createElement('button');btnU.className='cbtn';btnU.title='Atualizações';
    btnU.innerHTML='<svg width="11" height="11" viewBox="0 0 20 20" fill="none"><path d="M10 2C5.58 2 2 5.36 2 9.5c0 1.9.72 3.63 1.9 4.97L2.5 17.5l3.3-1.1A8.1 8.1 0 0010 17c4.42 0 8-3.36 8-7.5S14.42 2 10 2z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>';
    btnU.addEventListener('click',e=>{e.stopPropagation();monday.execute('openItemCard',{itemId:parseInt(item.id),kind:'updates'});});
    tjrow.appendChild(tj);tjrow.appendChild(btnU);card.appendChild(tjrow);

    // ── linha inferior: prazo | status | espaço | ↗ ──
    const row=document.createElement('div');row.className='srow';

    const dateVal=sub._range?fmtDate(sub._range):(sub.cron?.match(/\d{4}-\d{2}-\d{2}/)?.[0]||'');

    // Wrapper visível com texto via ::before — input invisível absoluto por cima
    const prazoWrap=document.createElement('div');
    prazoWrap.className='prazo-wrap '+(prazoClass(dateVal)||'');
    prazoWrap.dataset.label='📅 '+prazoLabel(dateVal);
    prazoWrap.title='Editar prazo';

    const di=document.createElement('input');
    di.type='date';di.value=dateVal;
    di.className='sprazo-input';
    di.addEventListener('mousedown',e=>e.stopPropagation());
    di.addEventListener('change',async e=>{
      const val=e.target.value;if(!val)return;
      if(!sub.cronColId){toast('cronColId null',true);return;}
      prazoWrap.dataset.label='📅 '+prazoLabel(val);
      prazoWrap.className='prazo-wrap '+(prazoClass(val)||'');
      await mutPrazo(sub,val);
    });
    prazoWrap.appendChild(di);
    row.appendChild(prazoWrap);

    // STATUS badge + dropdown
    const stWrap=document.createElement('div');stWrap.className='sst';
    const badge=document.createElement('div');badge.className=`stbadge ${stCls(sub.status)}`;badge.textContent=sub.status||'Em pauta';
    const dd=document.createElement('div');dd.className='stdd';
    document.body.appendChild(dd); // fora do card para não ser cortado

    Object.entries(STATUS_META).forEach(([label,meta])=>{
      const opt=document.createElement('div');opt.className='stdd-item';
      opt.innerHTML=`<span class="stdd-dot" style="background:${meta.dot}"></span>${label}`;
      opt.addEventListener('click',async e=>{
        e.stopPropagation();dd.classList.remove('open');
        await mutSubStatus(sub,label);
      });
      dd.appendChild(opt);
    });

    badge.addEventListener('dragstart',e=>e.stopPropagation());
    badge.addEventListener('click',e=>{
      e.stopPropagation();
      document.querySelectorAll('.stdd.open').forEach(d=>{if(d!==dd)d.classList.remove('open');});
      if(!dd.classList.contains('open')){
        const r=badge.getBoundingClientRect();
        dd.style.top=(r.bottom+4)+'px';
        dd.style.left=r.left+'px';
      }
      dd.classList.toggle('open');
    });

    stWrap.appendChild(badge);row.appendChild(stWrap);
    const sp=document.createElement('div');sp.style.flex='1';row.appendChild(sp);

    // ↗
    const btnO=document.createElement('button');btnO.className='cbtn';btnO.title='Abrir job';btnO.textContent='↗';
    btnO.addEventListener('click',e=>{e.stopPropagation();monday.execute('openItemCard',{itemId:parseInt(item.id)});});
    row.appendChild(btnO);
    card.appendChild(row);
  }

  return card;
}

// ─── FILTRO / VISTA ───────────────────────────────────────────────────
function populateFilter(){
  const dd=document.getElementById('fp-dd');dd.innerHTML='';
  const allLbl=document.createElement('label');allLbl.className='fp-sep';
  const allCk=document.createElement('input');allCk.type='checkbox';allCk.checked=!selPersons.length;
  allLbl.appendChild(allCk);allLbl.appendChild(document.createTextNode(' Todas as pessoas'));
  dd.appendChild(allLbl);
  allCk.addEventListener('change',()=>{
    if(allCk.checked){selPersons=[];dd.querySelectorAll('input[data-p]').forEach(c=>c.checked=false);}
    updateFpBtn();saveFilter();render();
  });
  allPeople.forEach(name=>{
    const lbl=document.createElement('label');
    const ck=document.createElement('input');ck.type='checkbox';ck.dataset.p=name;ck.checked=selPersons.includes(name);
    lbl.appendChild(ck);lbl.appendChild(document.createTextNode(' '+name));
    lbl.addEventListener('change',()=>{
      if(ck.checked){if(!selPersons.includes(name))selPersons.push(name);}
      else selPersons=selPersons.filter(p=>p!==name);
      allCk.checked=!selPersons.length;updateFpBtn();saveFilter();render();
    });
    dd.appendChild(lbl);
  });
  updateFpBtn();
}

function updateFpBtn(){
  const btn=document.getElementById('fp-btn');
  btn.textContent=!selPersons.length?'Todas as pessoas':selPersons.length===1?selPersons[0]:selPersons.length+' pessoas';
}

async function saveFilter(){if(!autoSaveEnabled)return;try{await monday.storage.setItem('kf_'+boardId,JSON.stringify(selPersons));}catch(_){}}
async function loadFilter(){try{const r=await monday.storage.getItem('kf_'+boardId);selPersons=r.data?.value?JSON.parse(r.data.value):[];}catch(_){selPersons=[];}}
async function saveView(){try{await monday.storage.setItem('kv_'+boardId,JSON.stringify(selPersons));toast('Vista salva!');}catch(_){toast('Erro ao salvar vista',true);}}
async function restoreView(){
  try{
    const r=await monday.storage.getItem('kv_'+boardId);
    selPersons=r.data?.value?JSON.parse(r.data.value):[];
    await saveFilter();populateFilter();render();toast('Vista restaurada!');
  }catch(_){toast('Erro ao restaurar vista',true);}
}
async function loadSubAdmins(){try{const r=await monday.storage.getItem('ka_'+boardId);subAdmins=r.data?.value?JSON.parse(r.data.value):[];}catch(_){subAdmins=[];}}
async function saveSubAdmins(){try{await monday.storage.setItem('ka_'+boardId,JSON.stringify(subAdmins));}catch(_){toast('Erro ao guardar acesso',true);}}

function openAccess(){
  const list=document.getElementById('access-list');list.innerHTML='';
  [...new Set(allItems.flatMap(it=>it.subs.map(s=>s.resp)))].sort((a,b)=>a.localeCompare(b)).forEach(name=>{
    const uid=Object.keys(userNameById).find(id=>userNameById[id]===name)||'';
    const item=document.createElement('div');item.className='access-item';
    const ck=document.createElement('input');ck.type='checkbox';ck.dataset.uid=uid;ck.checked=!!(uid&&subAdmins.includes(uid));
    const lbl=document.createElement('span');lbl.textContent=name;
    item.appendChild(ck);item.appendChild(lbl);list.appendChild(item);
  });
  document.getElementById('access-panel').classList.add('open');
}

// ─── LOAD ─────────────────────────────────────────────────────────────
async function load(bId){
  document.getElementById('loading').style.display='flex';
  document.getElementById('board').style.display='none';
  // limpar dropdowns e inputs soltos de render anterior
  document.querySelectorAll('.stdd').forEach(el=>el.remove());
  try{
    const[schema]=await Promise.all([fetchSchema(bId),fetchUsers(),loadSubAdmins()]);
    await loadFilter();
    const raw=await fetchItems(bId);
    allItems=processItems(raw,schema);
    if(isAdmin){
      populateFilter();
      document.getElementById('fp-wrap').style.display='block';
      if(!document.getElementById('btn-save-view')){
        const fpWrap=document.getElementById('fp-wrap');
        const btnS=document.createElement('button');btnS.className='hbtn';btnS.id='btn-save-view';btnS.textContent='Salvar filtro';
        const btnR=document.createElement('button');btnR.className='hbtn';btnR.id='btn-restore-view';btnR.textContent='Carregar filtro';
        fpWrap.after(btnR);fpWrap.after(btnS);
        btnS.addEventListener('click',saveView);
        btnR.addEventListener('click',()=>{autoSaveEnabled=true;restoreView();});
      }
    }
    if(isMainAdmin)document.getElementById('btn-access').style.display='inline-flex';
    document.getElementById('loading').style.display='none';
    document.getElementById('board').style.display='flex';
    render();
  }catch(e){
    document.getElementById('loading').innerHTML=`<span style="color:#ef5350">Erro: ${e.message}</span>`;
    console.error(e);
  }
}

// ─── EVENTOS GLOBAIS ──────────────────────────────────────────────────
const fpBtn=document.getElementById('fp-btn'),fpDd=document.getElementById('fp-dd');
fpBtn.addEventListener('click',e=>{e.stopPropagation();fpDd.classList.toggle('open');});
document.addEventListener('click',e=>{
  if(!fpDd.contains(e.target)&&e.target!==fpBtn)fpDd.classList.remove('open');
  if(!e.target.closest('.sst')&&!e.target.closest('.stdd'))
    document.querySelectorAll('.stdd.open').forEach(d=>d.classList.remove('open'));
});
document.getElementById('sort-sel').addEventListener('change',e=>{sortOrder=e.target.value;render();});
document.getElementById('btn-refresh').addEventListener('click',()=>{if(boardId)load(boardId);});
document.getElementById('btn-access').addEventListener('click',openAccess);
document.getElementById('btn-save-access').addEventListener('click',async()=>{
  subAdmins=[...document.querySelectorAll('#access-list input:checked')].map(c=>c.dataset.uid).filter(Boolean);
  await saveSubAdmins();
  document.getElementById('access-panel').classList.remove('open');
  toast('Acesso guardado!');
  const uid=String(Object.keys(userNameById).find(id=>userNameById[id]===currentUserName)||'');
  isAdmin=isMainAdmin||subAdmins.includes(uid);
  if(isAdmin){populateFilter();document.getElementById('fp-wrap').style.display='block';}
  render();
});
document.getElementById('btn-close-access').addEventListener('click',()=>document.getElementById('access-panel').classList.remove('open'));
setInterval(()=>{if(boardId)load(boardId);},5*60*1000);

// scroll bidirecional no board
const boardEl=document.getElementById('board');
let isPanning=false,panX=0,panY=0,panSL=0,panST=0;
boardEl.addEventListener('mousedown',e=>{
  // só panar se clicar no fundo — não em cards nem handles
  if(e.target.closest('.card'))return;
  if(e.target!==boardEl&&!e.target.classList.contains('pkanban')
    &&!e.target.classList.contains('pkanban-hdr')
    &&!e.target.classList.contains('pkanban-cols')&&!e.target.classList.contains('col')
    &&!e.target.classList.contains('col-body')&&!e.target.classList.contains('col-scroll')
    &&!e.target.classList.contains('col-hdr'))return;
  isPanning=true;panX=e.clientX;panY=e.clientY;panSL=boardEl.scrollLeft;panST=boardEl.scrollTop;boardEl.style.cursor='grabbing';
});
document.addEventListener('mousemove',e=>{if(!isPanning)return;boardEl.scrollLeft=panSL-(e.clientX-panX);boardEl.scrollTop=panST-(e.clientY-panY);});
document.addEventListener('mouseup',()=>{if(isPanning){isPanning=false;boardEl.style.cursor='grab';}});

monday.listen('context',async res=>{
  const bId=res.data.boardId||(res.data.boardIds&&res.data.boardIds[0]);
  boardId=bId;
  document.getElementById('hdr-board').textContent=res.data.boardName||'Kanban';
  currentUserName=(res.data.user?.name||'').trim();
  isMainAdmin=res.data.user?.isAdmin===true;
  await loadSubAdmins();
  const uid=String(res.data.user?.id||'');
  isAdmin=isMainAdmin||subAdmins.includes(uid);
  await load(bId);
});

} // fim initKanban

</script>
