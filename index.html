<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Kanban</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
:root {
  --bg:#0f0f11;--surface:#1a1a1f;--surface2:#212127;--surface3:#26262d;
  --border:#2e2e38;--border2:#38383f;--text:#e4e4ea;--text-dim:#9494a2;--text-muted:#5c5c6b;--accent:#6c5fd5;
  --st-pauta-bg:rgba(0,133,255,.1);--st-pauta-border:rgba(0,133,255,.3);--st-pauta-text:#3d9bff;--st-pauta-dot:#0085ff;
  --st-andamento-bg:rgba(255,185,0,.1);--st-andamento-border:rgba(255,185,0,.3);--st-andamento-text:#ffb900;--st-andamento-dot:#ffb900;
  --st-pausado-bg:rgba(92,92,107,.1);--st-pausado-border:rgba(92,92,107,.3);--st-pausado-text:#9494a2;--st-pausado-dot:#5c5c6b;
  --st-concluido-bg:rgba(0,202,114,.1);--st-concluido-border:rgba(0,202,114,.3);--st-concluido-text:#00ca72;--st-concluido-dot:#00ca72;
  --radius:9px;--radius-sm:5px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',-apple-system,sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden;font-size:13px}

/* HEADER */
#hdr{display:flex;align-items:center;gap:10px;padding:0 16px;height:48px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0}
#hdr-title{font-size:13px;font-weight:600;color:var(--text)}
#hdr-sep{width:1px;height:16px;background:var(--border2)}
#hdr-board{font-size:11px;color:var(--text-muted);max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#hdr-right{margin-left:auto;display:flex;align-items:center;gap:8px}

/* FILTRO PESSOA — dropdown igual pauta-timeline */
#fperson-wrap{position:relative}
#fperson-btn{background:var(--surface2);border:1px solid var(--border);color:var(--text-dim);padding:4px 10px;border-radius:var(--radius-sm);font-size:11px;cursor:pointer;white-space:nowrap;font-family:inherit}
#fperson-btn:hover{background:var(--border)}
#fperson-dd{display:none;position:absolute;top:calc(100% + 4px);right:0;background:#1e1e1e;border:1px solid #444;border-radius:8px;z-index:500;min-width:170px;max-height:220px;overflow-y:auto;box-shadow:0 6px 16px rgba(0,0,0,.6)}
#fperson-dd.open{display:block}
#fperson-dd label{display:flex;align-items:center;gap:8px;padding:6px 12px;font-size:12px;color:#ddd;cursor:pointer;white-space:nowrap;user-select:none}
#fperson-dd label:hover{background:#2e2e2e}
#fperson-dd input[type=checkbox]{accent-color:var(--accent);cursor:pointer}
.fperson-all{border-bottom:1px solid #333;margin-bottom:2px}

#sort-select{background:var(--surface2);border:1px solid var(--border);color:var(--text-dim);padding:4px 8px;border-radius:var(--radius-sm);font-size:11px;font-family:inherit;cursor:pointer;outline:none}
#btn-refresh{width:28px;height:28px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text-dim);cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;transition:all .15s}
#btn-refresh:hover{border-color:var(--accent);color:var(--accent)}
#btn-refresh.spinning{animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* BOARD */
#board-wrap{flex:1;display:flex;overflow-x:auto;overflow-y:hidden;padding:12px 16px;gap:12px;align-items:flex-start}
#board-wrap::-webkit-scrollbar{height:4px}
#board-wrap::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}

/* COLUNA */
.col{width:460px;flex-shrink:0;display:flex;flex-direction:column;gap:8px;max-height:100%}
.col-header{display:flex;align-items:center;gap:7px;padding:0 2px 2px;flex-shrink:0}
.col-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.col-title{font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;flex:1}
.col-count{font-size:10px;color:var(--text-muted);background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:1px 6px;font-weight:600}
.col[data-status="Em Pauta"] .col-dot{background:var(--st-pauta-dot)}
.col[data-status="Em Pauta"] .col-title{color:var(--st-pauta-text)}
.col[data-status="Em Andamento"] .col-dot{background:var(--st-andamento-dot)}
.col[data-status="Em Andamento"] .col-title{color:var(--st-andamento-text)}
.col[data-status="Concluído"] .col-dot{background:var(--st-concluido-dot)}
.col[data-status="Concluído"] .col-title{color:var(--st-concluido-text)}
.col-body{overflow-y:auto;padding-bottom:8px;flex:1;min-height:60px}
.col-body::-webkit-scrollbar{width:3px}
.col-body::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

/* SEÇÃO PESSOA */
.person-section{margin-bottom:12px}
.person-label{display:flex;align-items:center;gap:6px;margin-bottom:7px;padding:0 2px}
.person-av{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:700;color:#fff;flex-shrink:0;overflow:hidden}
.person-av img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.person-name-lbl{font-size:11px;font-weight:600;color:var(--text-dim)}
.person-count-lbl{font-size:10px;color:var(--text-muted)}

/* GRID 2 COLUNAS */
.cards-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}

/* CARD */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:10px 11px;display:flex;flex-direction:column;gap:8px;cursor:grab;transition:border-color .15s,box-shadow .15s,opacity .15s;min-width:0}
.card:hover{border-color:var(--border2);box-shadow:0 3px 12px rgba(0,0,0,.3)}
.card.dragging{opacity:.35;cursor:grabbing}
.card-top{display:flex;align-items:flex-start;gap:5px;min-width:0}
.card-title{font-size:11px;font-weight:600;color:var(--text);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;line-height:1.4}
.card-actions{display:flex;gap:3px;flex-shrink:0}
.card-btn{width:20px;height:20px;background:none;border:1px solid var(--border);border-radius:4px;color:var(--text-muted);cursor:pointer;font-size:10px;display:flex;align-items:center;justify-content:center;transition:all .15s}
.card-btn:hover{border-color:var(--accent);color:var(--accent)}

/* BRIEFING */
.card-briefing{font-size:10px;color:var(--text-dim);padding:5px 8px;background:var(--surface2);border-radius:var(--radius-sm);border-left:2px solid var(--border2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;display:block}
.card-briefing.empty{color:var(--text-muted);font-style:italic;border-left-color:var(--border)}
a.card-briefing{text-decoration:none;cursor:pointer}
a.card-briefing:hover{color:var(--accent);border-left-color:var(--accent)}

/* SUB ROW */
.sub-row{display:flex;align-items:center;gap:4px;padding:4px 6px;background:var(--surface2);border-radius:var(--radius-sm);border:1px solid var(--border);min-width:0}
.sub-name{font-size:10px;color:var(--text-dim);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}

/* PRAZO */
.sub-prazo{position:relative;display:flex;align-items:center;gap:2px;background:var(--surface3);border:1px solid var(--border2);border-radius:4px;padding:2px 5px;font-size:10px;font-weight:500;color:var(--text-dim);cursor:pointer;white-space:nowrap;transition:all .15s;flex-shrink:0}
.sub-prazo:hover{border-color:var(--accent);color:var(--accent)}
.sub-prazo.overdue{border-color:rgba(239,83,80,.5);color:#ef5350;background:rgba(239,83,80,.08)}
.sub-prazo.today{border-color:rgba(255,185,0,.5);color:#ffb900;background:rgba(255,185,0,.08)}
.sub-prazo.soon{border-color:rgba(0,133,255,.5);color:#3d9bff;background:rgba(0,133,255,.08)}
.sub-prazo input[type=date]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}

/* STATUS */
.sub-status{position:relative;flex-shrink:0}
.st-badge{display:flex;align-items:center;gap:3px;padding:2px 6px;border-radius:4px;font-size:10px;font-weight:600;cursor:pointer;white-space:nowrap;border:1px solid transparent;transition:filter .15s}
.st-badge:hover{filter:brightness(1.15)}
.st-badge.em-pauta{background:var(--st-pauta-bg);border-color:var(--st-pauta-border);color:var(--st-pauta-text)}
.st-badge.em-andamento{background:var(--st-andamento-bg);border-color:var(--st-andamento-border);color:var(--st-andamento-text)}
.st-badge.pausado{background:var(--st-pausado-bg);border-color:var(--st-pausado-border);color:var(--st-pausado-text)}
.st-badge.concluido{background:var(--st-concluido-bg);border-color:var(--st-concluido-border);color:var(--st-concluido-text)}
.st-dd{position:absolute;top:calc(100% + 3px);right:0;background:var(--surface2);border:1px solid var(--border2);border-radius:var(--radius-sm);z-index:300;box-shadow:0 8px 24px rgba(0,0,0,.55);display:none;min-width:140px;overflow:hidden}
.st-dd.open{display:block}
.st-dd-item{padding:7px 11px;font-size:11px;color:var(--text-dim);cursor:pointer;display:flex;align-items:center;gap:7px;transition:background .1s}
.st-dd-item:hover{background:var(--border);color:var(--text)}
.st-dd-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}

/* DRAG GHOST */
#drag-ghost{position:fixed;pointer-events:none;z-index:9999;background:var(--surface2);border:1px solid var(--accent);border-radius:var(--radius);padding:7px 11px;font-size:11px;font-weight:600;color:var(--text);box-shadow:0 8px 24px rgba(0,0,0,.6);display:none;max-width:200px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* DROP ZONE */
.col-drop-zone{min-height:60px;border-radius:var(--radius);transition:background .15s}
.col-drop-zone.drag-active{background:rgba(108,95,213,.07);border:1px dashed rgba(108,95,213,.4)}

/* LOADING */
#loading{flex:1;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;color:var(--text-muted)}
.spinner{width:22px;height:22px;border:2px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
.col-empty{grid-column:1/-1;padding:18px;text-align:center;font-size:11px;color:var(--text-muted);border:1px dashed var(--border);border-radius:var(--radius)}

/* TOAST */
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--surface2);border:1px solid var(--border2);color:var(--text);padding:7px 14px;border-radius:8px;font-size:11px;z-index:999;display:none;box-shadow:0 4px 16px rgba(0,0,0,.4);white-space:nowrap}
#toast.show{display:block}
#toast.error{border-color:#ef5350;color:#ef5350}
</style>
</head>
<body>

<div id="hdr">
  <div id="hdr-title">Kanban</div>
  <div id="hdr-sep"></div>
  <div id="hdr-board">—</div>
  <div id="hdr-right">
    <div id="fperson-wrap">
      <button id="fperson-btn">Todas as pessoas</button>
      <div id="fperson-dd"></div>
    </div>
    <select id="sort-select">
      <option value="asc">Prazo ↑</option>
      <option value="desc">Prazo ↓</option>
    </select>
    <button id="btn-refresh">↻</button>
  </div>
</div>

<div id="loading"><div class="spinner"></div><span>Carregando...</span></div>
<div id="board-wrap" style="display:none"></div>
<div id="toast"></div>
<div id="drag-ghost"></div>

<script>
